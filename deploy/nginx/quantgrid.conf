# QuantGrid production nginx configuration
# Canonical domain: quantgrid.info

limit_req_zone $binary_remote_addr zone=quantgrid_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=quantgrid_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=quantgrid_connection:10m;

log_format quantgrid_json escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"request_id":"$request_id"}';

# Reject unknown HTTP hosts.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Reject unknown HTTPS/SNI hosts.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Canonical HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name quantgrid.info www.quantgrid.info;

    root /var/www/quantgrid;
    index index.html;

    client_max_body_size 20m;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quantgrid.info$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quantgrid.info www.quantgrid.info;

    ssl_certificate /etc/letsencrypt/live/quantgrid.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantgrid.info/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_session_cache shared:QuantGridSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    access_log /var/log/nginx/quantgrid_access.log quantgrid_json;

    root /var/www/quantgrid;
    index index.html;

    client_max_body_size 20m;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; manifest-src 'self'" always;

    location /api/ {
        limit_req zone=quantgrid_api burst=40 nodelay;
        limit_conn quantgrid_connection 20;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /health {
        limit_req zone=quantgrid_api burst=10 nodelay;
        limit_conn quantgrid_connection 10;

        proxy_pass http://127.0.0.1:8000/health;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Authentication endpoints receive a stricter rate limit.
    location /api/auth/ {
        limit_req zone=quantgrid_auth burst=10 nodelay;
        limit_conn quantgrid_connection 10;

        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /ws {
        limit_conn quantgrid_connection 10;

        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; manifest-src 'self'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; manifest-src 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: CI Bottleneck Agent

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: quantgrid-ci-bottleneck-agent
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Analyze completed CI runs and PR queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTGRID_CI_REPORT_PATH: ${{ runner.temp }}/quantgrid-ci-bottleneck-report.md
        run: python scripts/ci_bottleneck_agent.py
      - name: Publish one continuously updated tracking issue
        uses: actions/github-script@v7
        env:
          QUANTGRID_CI_REPORT_PATH: ${{ runner.temp }}/quantgrid-ci-bottleneck-report.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const title = 'QuantGrid CI bottleneck agent report';
            const marker = '<!-- quantgrid-bottleneck-agent -->';
            // Job summary is also the canonical rendered report.
            const summaryPath = process.env.QUANTGRID_CI_REPORT_PATH;
            const body = fs.readFileSync(summaryPath, 'utf8');
            if (!body.includes(marker)) throw new Error('Missing report marker');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(x => !x.pull_request && x.title === title && (x.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }

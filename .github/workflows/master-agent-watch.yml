name: QuantGrid 24x7 Master Agent Watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: quantgrid-master-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safe offline monitoring checks
        id: scan
        run: |
          python scripts/master_agent_watch.py --output master-agent-report.md
          cat master-agent-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish actionable report to GitHub issue
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- quantgrid-master-watch -->';
            const report = fs.readFileSync('master-agent-report.md', 'utf8');
            const title = 'QuantGrid Master Agent: scheduled safety watch';
            const {owner, repo} = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'open', per_page: 100});
            const issue = existing.find(x => !x.pull_request && x.body?.includes(marker));
            const body = marker + '\\n' + report;
            if (issue) {
              await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }

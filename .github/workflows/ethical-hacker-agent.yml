name: Ethical Hacker Agent

on:
  pull_request:
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defensive-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan repository without external requests
        run: python scripts/ethical_hacker_agent.py
      - name: Upload findings for review
        uses: actions/upload-artifact@v4
        with:
          name: ethical-hacker-report
          path: ethical-hacker-report.json
          retention-days: 30

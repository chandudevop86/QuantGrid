name: QuantGrid External Uptime Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quantgrid-external-uptime
  cancel-in-progress: false

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public API health (read-only)
        id: health
        continue-on-error: true
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' https://quantgrid.info/health)" || code="000"
          if [ "$code" = "200" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or resolve uptime issue
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.health.outputs.healthy }}
        with:
          script: |
            const marker = '<!-- quantgrid-external-uptime -->';
            const title = 'QuantGrid external API health alert';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.title === title && i.body?.includes(marker));
            const healthy = process.env.HEALTHY === 'true';
            if (!healthy) {
              const body = marker + '\\nPublic https://quantgrid.info/health did not return HTTP 200. ' +
                'Check EC2, nginx, backend and networking. No automated restart or trading action was performed.';
              if (!existing) {
                await github.rest.issues.create({owner, repo, title, body, labels: []});
              }
            } else if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number,
                body: 'Public health check recovered (HTTP 200).'});
              await github.rest.issues.update({owner, repo, issue_number: existing.number, state: 'closed'});
            }
